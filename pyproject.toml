[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitra"
version = "0.1.0"
description = "A fast local Git repository browser and review tool."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gitra = "gitra.cli:main"

[tool.setuptools]
packages = ["gitra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
